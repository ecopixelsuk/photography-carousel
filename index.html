<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
}

.carousel {
    width: 100%;
    overflow: hidden;
}

.track {
    display: flex;
    width: max-content;
    gap: 8px;
    animation: scroll 32s linear infinite;
}

.slide {
    width: 25vw;
    max-width: 400px;
    min-width: 200px;
    aspect-ratio: 2 / 3;
    flex-shrink: 0;
    overflow: hidden;
}

.slide img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

/*
   We have 8 unique images followed by
   an exact duplicate of those 8 images.
   Moving exactly half the track creates
   the seamless loop.
*/

@keyframes scroll {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}

/* Tablet */
@media (max-width: 900px) {

    .slide {
        width: 33.333vw;
    }

    .track {
        gap: 6px;
        animation-duration: 28s;
    }
}

/* Phone */
@media (max-width: 600px) {

    .slide {
        width: 50vw;
    }

    .track {
        gap: 5px;
        animation-duration: 24s;
    }
}

/* Pause while hovering */
.carousel:hover .track {
    animation-play-state: paused;
}
</style>
</head>
